# testnet — Ink Sepolia (тестовые деньги), mainnet — реальные
mode: testnet
# true: бот только считает и пишет в лог, ордера НЕ отправляет
dry_run: true
subaccount_name: default

loop_interval_s: 3        # как часто проверять рынок
requote_bps: 2            # переставлять ордера, если mid сдвинулся на 0.02%
order_ttl_s: 120          # ордер сам истечёт через 2 мин, даже если бот упадёт

# Пауза при резком движении: >0.4% за 60 с → снять ордера на 2 мин
vol_window_s: 60
vol_max_move_bps: 40
vol_pause_s: 120

max_daily_loss_usd: 20    # дневной убыток, после которого бот всё закрывает и останавливается
min_health_ratio: 0.5     # maintenance health / equity; ниже — закрыть позиции

# Фандинг (ставка за 24ч). Если лонги платят больше 0.05%/сутки — не набираем лонг (и наоборот).
funding_max_daily: 0.0005
fills_sync_s: 60          # как часто подтягивать свои сделки для отчёта
reject_pause_s: 300       # пауза рынка после 3 отказов подряд (выходные: soft_reduce_only)

# Защита от случайного запуска на реальных деньгах:
# mainnet + dry_run: false работает ТОЛЬКО если здесь true
mainnet_live_confirm: false

markets:
  - symbol: BTC-PERP
    order_size_usd: 120    # размер котировки в $ (минимум биржи — 100$)
    offset_bps: 4          # отступ от mid (0.04%)
    max_position_usd: 250  # дальше — котируем только на сокращение позиции
    hard_position_usd: 500 # тут — принудительное закрытие
    skew_bps: 3            # сдвиг котировок при полном инвентаре
